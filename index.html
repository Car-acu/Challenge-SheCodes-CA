<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="src/styles.css" />
    <title>My weather application</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Google+Sans:ital,opsz,wght@0,17..18,400..700;1,17..18,400..700&display=swap"
      rel="stylesheet"
    />
    <script src="https://cdn.jsdelivr.net/npm/axios@1.13.2/dist/axios.min.js"></script>
  </head>
  <body>
    <div class="container">
      <header>
        <form class="search-section" id="search-form">
          <input
            type="search"
            placeholder="Enter a city.."
            required
            class="city-search-box"
            id="city-input"
          />
          <input type="submit" value="Search" class="submit-button" />
        </form>
      </header>
      <main>
        <div class="current-city-weather">
          <div class="current-city-section">
            <h1 class="main-city" id="main-city"></h1>
            <p class="weather-description">
              <span id="current-time"></span>,
              <span id="current-conditions"></span>
              <br />
              Humidity: <strong id="current-humidity"></strong>, Wind:
              <strong id="current-wind"></strong>
            </p>
          </div>
          <div class="current-temperature-section">
            <div id="weather-icon"></div>
            <div class="current-temp" id="current-temp"></div>
            <div class="current-temp-unit">°C</div>
          </div>
        </div>
        <div class="forecast-section" id="forecast"></div>
      </main>
      <footer>
        <p>
          This project was coded by
          <a href="https://github.com/Car-acu" target="_blank">
            <span class="name1">C</span><span class="name2">a</span
            ><span class="name3">r</span><span class="name4">o </span
            ><span class="name5">A</span><span class="name6">c</span
            ><span class="name7">u</span><span class="name8">n</span
            ><span class="name9">a</span>
          </a>
          and is
          <a
            href="https://github.com/Car-acu/Challenge-SheCodes-CA"
            target="_blank"
          >
            on GitHub</a
          >
          and
          <a href="https://caracu-challenge.netlify.app/" target="_blank"
            >hosted on Netlify</a
          >
        </p>
      </footer>
    </div>
    <script src="src/index.js"></script>
  </body>
</html>
